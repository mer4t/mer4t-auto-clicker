name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore m4AutoClicker.slnx

      - name: Build (Release)
        run: dotnet build m4AutoClicker.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test m4AutoClicker.slnx -c Release --no-build
